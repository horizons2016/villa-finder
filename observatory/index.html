<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAI Property Intelligence</title><style>body{font:16px system-ui;background:#f5f7f7;color:#163638;margin:0}main{max-width:1100px;margin:auto;padding:24px}h1{color:#07565b}section,article{background:white;border:1px solid #dce5e5;border-radius:12px;padding:16px;margin:10px 0}label{display:inline-grid;gap:5px;margin:5px}input,select{font:inherit;padding:10px;max-width:220px}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}a{color:#07565b}small{color:#536567}</style><main><h1>RAI Property Intelligence</h1><p>الدليل العقاري | سلطنة عمان</p><section>البيانات الحالية أرشيف النموذج السابق، وليست عروضاً مؤكدة التوفر. الأسعار معلنة وليست أسعار صفقات.</section><section id="filters"><label>المحافظة<select id="gov"></select></label><label>الولاية<select id="wil"></select></label><label>النوع<select id="type"></select></label><label>المصدر<select id="source"></select></label><label>الحد الأعلى للسعر<input id="price" type="number" min="0" placeholder="ر.ع."></label><label>بحث المنطقة<input id="query"></label></section><p id="count" aria-live="polite">تحميل البيانات…</p><div id="results"></div></main><script>
const $=id=>document.getElementById(id);let rows=[];
const fields={gov:'governorate',wil:'wilayat',type:'type',source:'source'};
function options(id,values){const el=$(id),old=el.value;el.replaceChildren(new Option('الكل',''));for(const v of [...new Set(values.filter(Boolean))].sort())el.add(new Option(v,v));if([...el.options].some(o=>o.value===old))el.value=old}
function render(){const selected=rows.filter(r=>Object.entries(fields).every(([id,key])=>!$(id).value||r[key]===$(id).value)&&(! $('price').value||(r.price!=null&&Number(r.price)<=Number($('price').value)))&&String(r.area||'').includes($('query').value.trim()));$('count').textContent=selected.length+' إعلاناً مطابقاً';$('results').replaceChildren();for(const r of selected){const card=document.createElement('article');for(const [tag,value] of [['h3',r.area||'منطقة غير محددة'],['p',r.price==null?'السعر غير متاح':Number(r.price).toLocaleString('en-US')+' ر.ع.'],['p',[r.governorate,r.wilayat,r.type,r.deal].filter(Boolean).join(' · ')],['small',r.source+' | تاريخ النشر: '+(r.published_at||'غير معروف')+' | التوفر غير مؤكد']]){const e=document.createElement(tag);e.textContent=value;card.append(e)}try{const u=new URL(r.url);if(u.protocol==='https:'){const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='فتح المصدر الأصلي';card.append(document.createElement('p')).append(a)}}catch{}$('results').append(card)}}
fetch('legacy.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{rows=data;for(const [id,key] of Object.entries(fields))options(id,rows.map(r=>r[key]));$('filters').addEventListener('input',()=>{options('wil',rows.filter(r=>!$('gov').value||r.governorate===$('gov').value).map(r=>r.wilayat));render()});render()}).catch(()=>$('count').textContent='تعذر تحميل البيانات');
</script></html>
