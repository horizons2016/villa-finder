name: Property observatory checks

on:
  push:
    branches: [ai/property-observatory]
    paths: ['observatory/**', '.github/workflows/property-observatory-checks.yml']
  pull_request:
    paths: ['observatory/**', '.github/workflows/property-observatory-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: observatory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend tests
        run: python -m unittest discover -s tests -v
      - name: Validate the static build
        run: |
          node --check ui/app.js
          python -m rai build dist
          test -s dist/public-data.json
      - uses: actions/upload-artifact@v4
        with:
          name: property-observatory-preview
          path: observatory/dist/
          retention-days: 7
